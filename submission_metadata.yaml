  cpu_cores: 2
  ram_gb: 16
  python_version: "3.14.5"
  os: "Windows"
  uses_gpu_for_inference: false
  has_network_during_ranking: false
  pre_computation_required: true
  pre_computation_time_minutes: 5

# AI tools declaration
ai_tools_used:
  - "Gemini"

ai_usage_summary: |
  Used Gemini for codebase research, architectural design, honeypot pattern profiling, and code refactoring. All final scoring heuristics and filtering logic were validated locally on CPU.

# Approach summary
methodology_summary: |
  A two-stage candidate ranking system built for CPU efficiency. Stage 1 utilizes a concise candidate profile text builder (current title, headline, and top 5 skills) encoded with all-MiniLM-L6-v2 and indexed in a FAISS HNSW index to retrieve the top 500 candidates. Stage 2 executes a multi-signal reranking formula that filters out non-technical titles and 70 mathematically proven honeypot profiles, scoring the remaining candidates on location fit, startup and founding history, notice period length, and production ML depth.

# Declarations
declarations:
